<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libertinus+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <title>Archive</title>
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
</head>

<body data-page="archive">
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-logo">Cian's Community Calendar</h1>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Calendar</a></li>
                <li><a href="about.html" class="nav-link">What is this?</a></li>
                <li><a href="archive.html" class="nav-link active">Archive</a></li>
            </ul>
        </div>
    </nav>

    <div class="filters">
        <!-- The year list is filled in by js/main.js from the events in data/events.json -->
        <select id="filter-year">
            <option value="all">All Years</option>
        </select>
        <select id="filter-month">
            <option value="all">All Months</option>
            <option value="01">January</option>
            <option value="02">February</option>
            <option value="03">March</option>
            <option value="04">April</option>
            <option value="05">May</option>
            <option value="06">June</option>
            <option value="07">July</option>
            <option value="08">August</option>
            <option value="09">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
        </select>
        <select id="filter-weapon">
            <option value="all">All Weapons</option>
            <option value="epee">Epee</option>
            <option value="foil">Foil</option>
            <option value="saber">Saber</option>
        </select>
        <select id="filter-format">
            <option value="all">All Formats</option>
            <option value="individual">Individual</option>
            <option value="team">Team</option>
        </select>
        <button id="reset-filters">Reset</button>

        <div class="header">
            <h1>Archived Events</h1>

            <!-- Past events are drawn here automatically: anything whose end date has passed. Nothing to move by hand. -->
            <div class="container" id="events"></div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
