<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../switcher.css">
    <title>Cian's Calendar</title>
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
</head>

<body data-page="upcoming">
    <a class="skip" href="#main">Skip to content</a>
    <header class="site">
        <div class="wrap bar">
            <a class="brand" href="index.html">Cian's Community Calendar</a>
            <nav aria-label="Pages">
                <ul class="nav-menu">
                <li><a href="index.html" class="nav-link active" aria-current="page">Calendar</a></li>
                <li><a href="about.html" class="nav-link">What is this?</a></li>
                <li><a href="archive.html" class="nav-link">Archive</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main" class="wrap">
        <h1>Upcoming events</h1>
        <p class="lede">Fencing competitions, camps and other events across NSW.</p>
        <p class="next-up" id="next-up" hidden></p>

        <section class="filters" aria-label="Filter events">
            <form id="filters" role="search">
                <div class="field field-search">
                    <label class="field-label" for="search">Search</label>
                    <input type="search" id="search" name="q" placeholder="Event name or venue" autocomplete="off" enterkeyhint="search" maxlength="80">
                </div>
                <div class="field">
                    <span class="field-label" id="label-weapon">Weapon</span>
                    <div class="seg" role="radiogroup" aria-labelledby="label-weapon">
                        <label class="seg-item"><input type="radio" name="weapon" value="all" checked><span>All</span></label>
                        <label class="seg-item"><input type="radio" name="weapon" value="foil"><span>Foil</span></label>
                        <label class="seg-item"><input type="radio" name="weapon" value="epee"><span>Epee</span></label>
                        <label class="seg-item"><input type="radio" name="weapon" value="saber"><span>Saber</span></label>
                    </div>
                </div>
                <div class="field">
                    <label class="field-label" for="month-select">Month</label>
                    <select id="month-select" name="month">
                    <option value="all">All</option>
                    </select>
                </div>
                <div class="field">
                    <label class="field-label" for="format-select">Format</label>
                    <select id="format-select" name="format">
                    <option value="all">All</option>
                    <option value="individual">Individual</option>
                    <option value="team">Team</option>
                    </select>
                </div>
                <div class="field">
                    <label class="field-label" for="type-select">Type</label>
                    <select id="type-select" name="type">
                    <option value="all">All</option>
                    <option value="competition">Competition</option>
                    <option value="camp">Camp</option>
                    <option value="other">Other</option>
                    </select>
                </div>
            </form>
            <div class="filters-foot">
                <p class="count" id="result-count" role="status"></p>
                <button type="reset" form="filters" id="reset-filters">Clear filters</button>
            </div>
        </section>

        <!-- Drawn by js/main.js from data/events.json: past events appear in the archive automatically -->
        <div id="events"></div>
    </main>

    <script type="module" src="js/main.js"></script>
    <script src="../switcher.js" defer></script>
</body>
</html>
