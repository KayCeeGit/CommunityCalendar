<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar admin</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <header>
        <h1>Calendar admin <small>runs on this computer only</small></h1>
        <nav id="tabs">
            <button data-tab="queue">Queue <span id="count-queue"></span></button>
            <button data-tab="post">From a post</button>
            <button data-tab="form">Add event</button>
            <button data-tab="published">Published <span id="count-published"></span></button>
        </nav>
    </header>

    <div id="toast" role="status" hidden></div>

    <main>
        <!-- Each tab is drawn by admin.js -->
        <section id="tab-queue"></section>

        <section id="tab-post" hidden>
            <h2>Add from a post</h2>
            <p class="note">Crop a screenshot of the post or paste post text.</p>
            <ul id="post-errors" class="errors" hidden></ul>

            <form id="post-form" novalidate>
                <div id="post-shots" class="shots"></div>

                <label>Pasted text <small>(optional)</small>
                    <textarea name="text" rows="5"></textarea>
                </label>

                <div class="row">
                    <label>Organiser
                        <select name="organiser"></select>
                    </label>
                    <label>Link to the post <small>(optional)</small>
                        <input type="url" name="url" placeholder="https://" autocomplete="off">
                    </label>
                </div>

                <div class="buttons">
                    <button type="submit" class="primary" id="post-submit">Read the post</button>
                </div>
            </form>
        </section>

        <section id="tab-form" hidden>
            <h2 id="form-title">Add event</h2>
            <ul id="form-errors" class="errors" hidden></ul>

            <form id="event-form" novalidate>
                <label>Name
                    <input name="name" autocomplete="off">
                </label>

                <div class="row">
                    <label>Start date
                        <input type="date" name="start_date">
                    </label>
                    <label>End date <small>(blank = one day)</small>
                        <input type="date" name="end_date">
                    </label>
                </div>

                <!-- The checkboxes are filled in from the schema, so the options can't drift from the rules -->
                <fieldset data-field="weapons"><legend>Weapons</legend></fieldset>
                <fieldset data-field="format"><legend>Format</legend></fieldset>
                <fieldset data-field="gender"><legend>Gender</legend></fieldset>
                <fieldset data-field="level"><legend>Level</legend></fieldset>

                <label>Venue
                    <input name="venue" autocomplete="off">
                </label>

                <label>Organiser
                    <select name="organiser"></select>
                </label>

                <label>Link <small>(page with the details)</small>
                    <input type="url" name="url" placeholder="https://" autocomplete="off">
                </label>

                <div class="buttons" id="form-buttons"></div>
            </form>
        </section>

        <section id="tab-published" hidden></section>
    </main>

    <script type="module" src="admin.js"></script>
</body>
</html>
